name: Release

# Монорепозиторий: один тег vX.Y.Z — один релиз со всеми плагинами одной версии.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-openide

      - name: Version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # vX.Y.Z-beta.1 и т.п. — пре-релиз
          if [[ "$version" == *-* ]]; then echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"; fi

      - name: Build, test and verify plugins
        run: ./gradlew build buildPlugin verifyPluginStructure -PopenidePath="$OPENIDE_HOME" -PpluginVersion="${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" */build/distributions/*.zip \
            --title "PHP Tools ${{ steps.version.outputs.version }}" \
            --generate-notes --verify-tag ${{ steps.version.outputs.prerelease }}
