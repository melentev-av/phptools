pluginGroup=dev.phptools
# Версия у каждого плагина своя: pluginVersion.<модуль>. Релиз плагина — тег <модуль>-vX.Y.Z с той же версией.
# Изменение в core попадает в плагин, только если поднять версию и выпустить этот плагин.
pluginVersion.phpstan=0.2.0
pluginVersion.psalm=0.2.0
pluginVersion.php-cs-fixer=0.2.0
pluginVersion.phan=0.2.0
pluginVendor=PHP Tools
pluginVendorEmail=melentev.av@gmail.com
platformSinceBuild=262
# Путь к установленной OpenIDE (на macOS — бандл .app). Каждый разработчик задаёт свой,
# лучше в ~/.gradle/gradle.properties, чтобы не коммитить: там значение имеет приоритет над этим файлом.
openidePath=/path/to/OpenIDE
# Сборка OpenIDE, против которой собирает CI (дистрибутив https://download.openide.ru/<build>/openIDE-<build>.tar.gz).
openideBuild=262.10968.63.1
javaVersion=25
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true
# Классов платформы OpenIDE много: компилятору Kotlin и Gradle не хватает памяти по умолчанию (OOM на чистой сборке).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
